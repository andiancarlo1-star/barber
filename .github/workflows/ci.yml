name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://navaja:navaja@localhost:5432/navaja?schema=public
      AUTH_SECRET: ci-build-only-secret-change-me
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYMENT_PROVIDER: MOCK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: navaja-barber-studio:ci
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
