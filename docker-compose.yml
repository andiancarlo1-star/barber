services:
  db:
    image: postgres:16-alpine
    container_name: navaja-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-navaja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navaja_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-navaja}
      TZ: America/Guatemala
    ports:
      - "5433:5432"
    volumes:
      - navaja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-navaja} -d ${POSTGRES_DB:-navaja}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: deps
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-navaja}:${POSTGRES_PASSWORD:-navaja_dev_password}@db:5432/${POSTGRES_DB:-navaja}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: navaja-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-navaja}:${POSTGRES_PASSWORD:-navaja_dev_password}@db:5432/${POSTGRES_DB:-navaja}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  navaja_pgdata:
